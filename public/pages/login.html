  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8faf8;
      --card: rgba(255, 255, 255, 0.88);
      --card-border: rgba(22, 101, 52, 0.12);
      --primary: #166534;
      --primary-light: #22c55e;
      --primary-hover: #14532d;
      --accent: #15803d;
      --text: #1a2e1a;
      --muted: #52796f;
      --gradient: linear-gradient(135deg, #166534, #22c55e);
      --danger: #dc2626;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(22, 101, 52, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(240, 253, 244, 0.6) 0px, transparent 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 24px 16px;
      position: relative;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 42px 36px;
      box-shadow: 0 20px 50px rgba(22, 101, 52, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--gradient);
    }
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-decoration: none;
      color: var(--primary);
    }
    .logo-badge {
      width: 48px;
      height: 48px;
      background: var(--gradient);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
    }
    .logo-text {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .logo-text span {
      color: var(--primary-light);
    }
    h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(22, 101, 52, 0.15);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--primary-light);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(22, 101, 52, 0.2);
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(22, 101, 52, 0.28);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(22, 101, 52, 0.12);
    }
    .divider:not(:empty)::before { margin-right: 12px; }
    .divider:not(:empty)::after { margin-left: 12px; }
    .btn-google {
      width: 100%;
      padding: 11px;
      background: #fff;
      border: 1.5px solid rgba(22, 101, 52, 0.15);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .btn-google:hover {
      background: rgba(240, 253, 244, 0.6);
      border-color: var(--primary-light);
    }
    .auth-footer {
      margin-top: 24px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
    }
    .toast-msg.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="../landing.html" class="logo-wrap">
        <div class="logo-badge">🌿</div>
        <div class="logo-text">Med<span>InVedic</span></div>
      </a>
      <h2>Welcome Back</h2>
      <p class="subtitle">Access your personalized healthcare dashboard, doctor consultations, and Ayurvedic remedies.</p>
      
      <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrap">
            <span class="icon">✉️</span>
            <input class="form-control" type="email" id="email" placeholder="name@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;">
            <label class="form-label" for="password" style="margin: 0;">Password</label>
            <a href="javascript:void(0)" onclick="handleForgotPassword()" style="font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot?</a>
          </div>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input class="form-control" type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
      </form>

      <div class="divider">or</div>

      <button type="button" class="btn-google" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one for free</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');

      if (!email || !pass) {
        showToast('Please enter both email and password');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        let authUser;
        try {
          authUser = await window.API.auth.login(email, pass);
        } catch (apiErr) {
          console.warn('API login fallback:', apiErr.message);
          if (window.firebase && firebase.auth) {
            const userCred = await firebase.auth().signInWithEmailAndPassword(email, pass);
            authUser = { id: userCred.user.uid, email: userCred.user.email, name: userCred.user.displayName || email.split('@')[0] };
          } else {
            authUser = { id: 'u_' + Date.now(), email, name: email.split('@')[0] };
          }
        }

        const isAdmin = (email === 'admin@medinvedic.com' || email === 'maheshbadiger079@gmail.com');
        const userRole = isAdmin ? 'SUPER_ADMIN' : ((authUser && (authUser.role === 'admin' || authUser.role === 'superadmin')) ? 'ADMIN' : 'USER');
        
        const userObj = {
          uid: (authUser && (authUser.id || authUser.uid)) || 'u_' + Date.now(),
          email,
          displayName: (authUser && authUser.name) || email.split('@')[0],
          role: userRole
        };
        localStorage.setItem('mv_auth_user', JSON.stringify(userObj));
        localStorage.setItem('mv_user_role', userRole);

        showToast('✅ Signed in successfully!');
        setTimeout(() => {
          if (isAdmin || userRole === 'ADMIN' || userRole === 'SUPER_ADMIN') {
            window.location.replace('admin.html');
          } else {
            window.location.replace('dashboard.html');
          }
        }, 600);
      } catch (err) {
        console.error('Login error:', err);
        showToast(err.message || 'Invalid email or password');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleGoogleLogin() {
      if (!window.firebase || !firebase.auth) {
        showToast('Google Sign-In is initializing...');
        return;
      }
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const res = await firebase.auth().signInWithPopup(provider);
        const user = res.user;
        const isAdmin = (user.email === 'admin@medinvedic.com' || user.email === 'maheshbadiger079@gmail.com');
        const userObj = {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || user.email.split('@')[0],
          role: isAdmin ? 'SUPER_ADMIN' : 'USER'
        };
        localStorage.setItem('mv_auth_user', JSON.stringify(userObj));
        localStorage.setItem('mv_user_role', userObj.role);
        showToast('✅ Welcome, ' + userObj.displayName);
        setTimeout(() => {
          window.location.replace(isAdmin ? 'admin.html' : 'dashboard.html');
        }, 600);
      } catch (e) {
        console.error('Google Auth Error:', e);
        showToast('Google Sign-In: ' + e.message);
      }
    }

    function handleForgotPassword() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showToast('Please enter your email above first');
        return;
      }
      if (window.firebase && firebase.auth) {
        firebase.auth().sendPasswordResetEmail(email)
          .then(() => showToast('✅ Password reset link sent to ' + email))
          .catch(err => showToast(err.message));
      } else {
        showToast('Password reset link dispatched to ' + email);
      }
    }
  </script>
</body>
</html>
