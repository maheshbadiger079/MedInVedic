  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #f8faf8;
      --card: rgba(255, 255, 255, 0.90);
      --card-border: rgba(22, 101, 52, 0.12);
      --primary: #166534;
      --primary-light: #22c55e;
      --primary-subtle: #f0fdf4;
      --accent: #15803d;
      --text: #1a2e1a;
      --muted: #52796f;
      --gradient: linear-gradient(135deg, #166534, #22c55e);
      --gradient-subtle: linear-gradient(135deg, rgba(22, 101, 52, 0.08), rgba(34, 197, 94, 0.08));
      --danger: #dc2626;
      --warn: #d97706;
      --info: #0284c7;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(22, 101, 52, 0.04);
      --shadow-glass: 0 12px 36px rgba(22, 101, 52, 0.07);
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.07) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(22, 101, 52, 0.07) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(240, 253, 244, 0.7) 0px, transparent 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header Nav ── */
    .nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0 28px;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 900;
      font-size: 19px;
      letter-spacing: -0.3px;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      background: var(--gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(22, 101, 52, 0.25);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--primary);
      background: rgba(22, 101, 52, 0.08);
      font-weight: 700;
    }

    /* ── Main Container ── */
    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 80px;
      flex: 1;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      font-size: 14.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn-refresh {
      background: #fff;
      border: 1.5px solid var(--card-border);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: var(--primary-subtle);
      border-color: var(--primary-light);
      transform: translateY(-1px);
    }

    /* ── Filter Tabs Bar ── */
    .filter-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 28px;
      overflow-x: auto;
    }

    .filter-tab {
      background: transparent;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tab.active {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(22, 101, 52, 0.2);
    }

    /* ── Order Card (Glassmorphism) ── */
    .order-card {
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 26px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-glass);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .order-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: var(--gradient);
      opacity: 0.85;
    }

    .order-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 44px rgba(22, 101, 52, 0.1);
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(22, 101, 52, 0.08);
      flex-wrap: wrap;
      gap: 12px;
    }

    .order-id-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .order-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-subtle);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .order-id {
      font-weight: 800;
      font-size: 16.5px;
      color: var(--text);
    }

    .order-date {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-confirmed, .status-delivered { background: rgba(34, 197, 94, 0.15); color: #166534; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-processing { background: rgba(2, 132, 199, 0.12); color: var(--info); border: 1px solid rgba(2, 132, 199, 0.25); }
    .status-shipped, .status-packed { background: rgba(217, 119, 6, 0.12); color: var(--warn); border: 1px solid rgba(217, 119, 6, 0.25); }
    .status-cancelled { background: rgba(220, 38, 38, 0.12); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.25); }

    /* ── Stepper Pipeline ── */
    .stepper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 26px 0 22px;
      position: relative;
    }

    .stepper::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 30px;
      right: 30px;
      height: 3px;
      background: rgba(22, 101, 52, 0.12);
      z-index: 1;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid rgba(22, 101, 52, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
      transition: all 0.25s ease;
    }

    .step-item.active .step-circle {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(22, 101, 52, 0.35);
      transform: scale(1.1);
    }

    .step-item.passed .step-circle {
      background: var(--primary-light);
      border-color: var(--primary-light);
      color: #fff;
    }

    .step-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }

    .step-item.active .step-label {
      color: var(--primary);
      font-weight: 800;
    }

    /* ── Items List ── */
    .order-items-list {
      background: rgba(240, 253, 244, 0.6);
      border: 1px solid rgba(22, 101, 52, 0.08);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin: 18px 0;
      font-size: 13.5px;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px dashed rgba(22, 101, 52, 0.12);
    }

    .order-item-row:last-child { border: none; }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(22, 101, 52, 0.08);
      flex-wrap: wrap;
      gap: 12px;
    }

    .order-total-val {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
      margin-left: 6px;
    }

    .btn-cancel {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      color: var(--danger);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: var(--danger);
      color: #fff;
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 60px 28px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-glass);
    }

    .empty-icon-circle {
      width: 72px;
      height: 72px;
      background: var(--primary-subtle);
      border: 1px solid rgba(22, 101, 52, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-desc {
      color: var(--muted);
      font-size: 14px;
      max-width: 440px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      max-width: 680px;
      margin: 0 auto;
    }

    .action-card {
      background: #fff;
      border: 1.5px solid var(--card-border);
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .action-card:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(22, 101, 52, 0.08);
    }

    .action-card .act-icon {
      font-size: 24px;
    }

    .action-card .act-title {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--primary);
    }

    .action-card .act-sub {
      font-size: 11.5px;
      color: var(--muted);
      text-align: center;
    }

    #toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff;
      padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
      transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 9999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>

  <!-- ── MAIN ── -->
  <main class="container">
    <div class="page-header">
      <div>
        <div class="header-badge">📦 Live Fulfillment Pipeline</div>
        <h1 class="page-title">Order History &amp; Tracking</h1>
        <p class="page-subtitle">Track your pharmacy orders and prescription verification progress in real time.</p>
      </div>
      <button class="btn-refresh" onclick="loadOrders()">
        <span>⟳</span> Refresh Pipeline
      </button>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('ALL', this)">All Orders</button>
      <button class="filter-tab" onclick="setFilter('IN_TRANSIT', this)">🚚 In Delivery</button>
      <button class="filter-tab" onclick="setFilter('PROCESSING', this)">⏳ Processing</button>
      <button class="filter-tab" onclick="setFilter('COMPLETED', this)">✅ Completed</button>
    </div>

    <!-- Orders Container -->
    <div id="ordersList">
      <div style="text-align:center; padding: 40px; color: var(--muted);">Loading orders...</div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    let allOrders = [];
    let currentFilter = 'ALL';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    const STEPS = ['Confirmed', 'Processing', 'Packed', 'Shipped', 'Delivered'];

    function getStepIndex(status) {
      const s = (status || '').toLowerCase();
      if (s === 'delivered') return 4;
      if (s === 'shipped' || s === 'out for delivery') return 3;
      if (s === 'packed' || s === 'ready') return 2;
      if (s === 'processing') return 1;
      return 0; // Confirmed / Paid
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      renderOrders();
    }

    async function loadOrders() {
      const container = document.getElementById('ordersList');
      container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--muted);">Loading orders...</div>';

      try {
        let orders = [];
        try {
          if (window.API && window.API.orders && window.API.orders.my) {
            orders = await window.API.orders.my();
          }
        } catch (e) {
          console.warn('API orders notice:', e.message);
        }

        // Firestore fallback if local returned empty
        if (!orders || orders.length === 0) {
          try {
            const userStr = localStorage.getItem('mv_auth_user');
            const user = userStr ? JSON.parse(userStr) : null;
            if (user && user.uid && window.firebase && firebase.apps.length) {
              const snap = await firebase.firestore().collection('orders')
                .where('userId', '==', user.uid).orderBy('created_at', 'desc').limit(20).get().catch(() => ({ empty: true }));
              if (!snap.empty && snap.docs) {
                orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              }
            }
          } catch(fErr) {
            console.warn('Firestore fallback notice:', fErr.message);
          }
        }

        allOrders = orders || [];
        renderOrders();
      } catch (err) {
        console.warn('Error loading orders:', err);
        allOrders = [];
        renderOrders();
      }
    }

    function renderOrders() {
      const container = document.getElementById('ordersList');
      if (!container) return;

      let filtered = allOrders;
      if (currentFilter === 'IN_TRANSIT') {
        filtered = allOrders.filter(o => ['shipped', 'out for delivery', 'packed'].includes((o.orderStatus || o.status || '').toLowerCase()));
      } else if (currentFilter === 'PROCESSING') {
        filtered = allOrders.filter(o => ['processing', 'confirmed', 'created'].includes((o.orderStatus || o.status || '').toLowerCase()));
      } else if (currentFilter === 'COMPLETED') {
        filtered = allOrders.filter(o => (o.orderStatus || o.status || '').toLowerCase() === 'delivered');
      }

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon-circle">🌿</div>
            <h3 class="empty-title">No Orders in this Section</h3>
            <p class="empty-desc">You haven't placed any orders in this category yet. Explore our authentic Ayurvedic pharmacy or consult a verified doctor.</p>
            <div class="action-grid">
              <a href="online-pharmacy.html" class="action-card">
                <span class="act-icon">💊</span>
                <span class="act-title">Ayurvedic Pharmacy</span>
                <span class="act-sub">Authentic formulations &amp; herbal remedies</span>
              </a>
              <a href="consult.html" class="action-card">
                <span class="act-icon">👨‍⚕️</span>
                <span class="act-title">Doctor Consultation</span>
                <span class="act-sub">Online video calls with specialists</span>
              </a>
              <a href="prakriti-analysis.html" class="action-card">
                <span class="act-icon">🧠</span>
                <span class="act-title">Prakriti Analysis</span>
                <span class="act-sub">Discover your unique Dosha balance</span>
              </a>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const status = order.orderStatus || order.status || 'Confirmed';
        const isCancelled = status.toLowerCase() === 'cancelled';
        const stepIdx = getStepIndex(status);
        const dateStr = order.created_at ? (typeof order.created_at === 'string' ? order.created_at.substring(0,10) : 'Recent') : 'Recent';
        const items = Array.isArray(order.items) ? order.items : [];
        const total = order.total || order.total_amount || 499;
        const statusClass = 'status-' + status.toLowerCase().replace(/\\s+/g, '-');

        let stepperHtml = '';
        if (!isCancelled) {
          stepperHtml = `
            <div class="stepper">
              ${STEPS.map((st, idx) => {
                let cls = '';
                if (idx < stepIdx) cls = 'passed';
                else if (idx === stepIdx) cls = 'active';
                return `
                  <div class="step-item ${cls}">
                    <div class="step-circle">${idx < stepIdx ? '✓' : idx + 1}</div>
                    <div class="step-label">${st}</div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        const canCancel = ['confirmed', 'processing', 'created'].includes(status.toLowerCase());

        return `
          <div class="order-card">
            <div class="order-card-header">
              <div class="order-id-wrap">
                <div class="order-icon-box">📦</div>
                <div>
                  <div class="order-id">Order #${(order.order_id || order.id || 'ORD_542109').substring(0, 14)}</div>
                  <div class="order-date">Placed on ${dateStr}</div>
                </div>
              </div>
              <span class="status-badge ${statusClass}">● ${status}</span>
            </div>

            ${stepperHtml}

            ${items.length > 0 ? `
              <div class="order-items-list">
                <div style="font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:8px;">Items in package:</div>
                ${items.map(it => `
                  <div class="order-item-row">
                    <span>${it.name || it.productName || 'Medicine Item'} <strong style="color:var(--muted);">× ${it.quantity || 1}</strong></span>
                    <span style="font-weight:700; color:var(--primary);">₹${(it.price || 0) * (it.quantity || 1)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div class="order-footer">
              <div>
                <span style="font-size:13px; color:var(--muted);">Total Amount:</span>
                <span class="order-total-val">₹${total}</span>
              </div>
              ${canCancel ? `
                <button class="btn-cancel" onclick="cancelOrder('${order.id}')">✕ Cancel Order</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      try {
        if (window.API && window.API.orders && window.API.orders.cancel) {
          await window.API.orders.cancel(orderId);
        } else if (window.firebase && firebase.apps.length) {
          await firebase.firestore().collection('orders').doc(orderId).update({ orderStatus: 'CANCELLED' });
        }
        showToast('✅ Order cancelled successfully');
        loadOrders();
      } catch (err) {
        showToast('Error cancelling order: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
