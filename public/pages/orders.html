<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <meta charset="UTF-8">
  <title>My Orders &amp; Prescriptions — MedInVedic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/api.js?v=v_202603310200"></script>
  <script src="../js/i18n.js?v=v_202603310200"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8faf8;
      --card: rgba(255, 255, 255, 0.88);
      --card-border: rgba(22, 101, 52, 0.12);
      --primary: #166534;
      --primary-light: #22c55e;
      --accent: #15803d;
      --text: #1a2e1a;
      --muted: #52796f;
      --gradient: linear-gradient(135deg, #166534, #22c55e);
      --danger: #dc2626;
      --warn: #d97706;
      --info: #0284c7;
    }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(22, 101, 52, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(240, 253, 244, 0.6) 0px, transparent 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Nav */
    .nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 900;
      font-size: 19px;
    }
    .logo-badge {
      width: 38px;
      height: 38px;
      background: var(--gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--primary);
      background: rgba(22, 101, 52, 0.08);
    }
    /* Container */
    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 60px;
      flex: 1;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }
    .btn-refresh {
      background: #fff;
      border: 1.5px solid var(--card-border);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-refresh:hover {
      background: rgba(240, 253, 244, 0.8);
      border-color: var(--primary-light);
    }
    /* Order Card */
    .order-card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(22, 101, 52, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(22, 101, 52, 0.09);
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(22, 101, 52, 0.08);
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-id-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .order-id {
      font-weight: 800;
      font-size: 16px;
      color: var(--text);
    }
    .order-date {
      font-size: 12.5px;
      color: var(--muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-confirmed, .status-delivered { background: rgba(34, 197, 94, 0.15); color: #166534; }
    .status-processing { background: rgba(2, 132, 199, 0.12); color: var(--info); }
    .status-shipped, .status-packed { background: rgba(217, 119, 6, 0.12); color: var(--warn); }
    .status-cancelled { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
    
    /* Stepper */
    .stepper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 20px;
      position: relative;
    }
    .stepper::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: rgba(22, 101, 52, 0.12);
      z-index: 1;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }
    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(22, 101, 52, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .step-item.active .step-circle {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22, 101, 52, 0.3);
    }
    .step-item.passed .step-circle {
      background: var(--primary-light);
      border-color: var(--primary-light);
      color: #fff;
    }
    .step-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }
    .step-item.active .step-label {
      color: var(--primary);
      font-weight: 700;
    }
    /* Items list */
    .order-items-list {
      background: rgba(240, 253, 244, 0.4);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 16px 0;
      font-size: 13.5px;
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(22, 101, 52, 0.1);
    }
    .order-item-row:last-child { border: none; }
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(22, 101, 52, 0.08);
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-total-val {
      font-size: 18px;
      font-weight: 900;
      color: var(--primary);
    }
    .btn-cancel {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      color: var(--danger);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel:hover {
      background: var(--danger);
      color: #fff;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 14px;
    }
    .btn-shop {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 28px;
      background: var(--gradient);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(22, 101, 52, 0.2);
    }
    #toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff;
      padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
      transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 9999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../landing.html" class="nav-brand">
      <div class="logo-badge">🌿</div>
      <span>MedInVedic</span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="online-pharmacy.html" class="nav-link">Pharmacy</a>
      <a href="consult.html" class="nav-link">Doctors</a>
      <a href="orders.html" class="nav-link active">Orders</a>
      <a href="vedicmind.html" class="nav-link">VedicMind</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Order History &amp; Tracking</h1>
        <p class="page-subtitle">Track your pharmacy orders and prescription verification progress in real-time.</p>
      </div>
      <button class="btn-refresh" onclick="loadOrders()">⟳ Refresh</button>
    </div>

    <div id="ordersList">
      <div style="text-align:center; padding: 40px; color: var(--muted);">Loading your orders...</div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    const STEPS = ['Confirmed', 'Processing', 'Packed', 'Shipped', 'Delivered'];

    function getStepIndex(status) {
      const s = (status || '').toLowerCase();
      if (s === 'delivered') return 4;
      if (s === 'shipped' || s === 'out for delivery') return 3;
      if (s === 'packed' || s === 'ready') return 2;
      if (s === 'processing') return 1;
      return 0; // Confirmed / Paid
    }

    async function loadOrders() {
      const container = document.getElementById('ordersList');
      container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--muted);">Loading your orders...</div>';

      try {
        let orders = [];
        try {
          if (window.API && window.API.orders && window.API.orders.my) {
            orders = await window.API.orders.my();
          }
        } catch (e) {
          console.warn('Local orders API fallback:', e.message);
        }

        // Firestore fallback if local returned empty
        if (!orders || orders.length === 0) {
          const userStr = localStorage.getItem('mv_auth_user');
          const user = userStr ? JSON.parse(userStr) : null;
          if (user && user.uid && window.firebase && firebase.firestore) {
            const snap = await firebase.firestore().collection('orders')
              .where('userId', '==', user.uid).orderBy('created_at', 'desc').limit(20).get().catch(() => ({ empty: true }));
            if (!snap.empty && snap.docs) {
              orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }
          }
        }

        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📦</div>
              <h3 style="font-size:18px; font-weight:800; margin-bottom:6px;">No Orders Yet</h3>
              <p style="color:var(--muted); font-size:13.5px;">You haven't placed any medicine orders or doctor bookings yet.</p>
              <a href="online-pharmacy.html" class="btn-shop">Explore Pharmacy</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(order => {
          const status = order.orderStatus || order.status || 'Confirmed';
          const isCancelled = status.toLowerCase() === 'cancelled';
          const stepIdx = getStepIndex(status);
          const dateStr = order.created_at ? (typeof order.created_at === 'string' ? order.created_at.substring(0,10) : 'Recent') : 'Recent';
          const items = Array.isArray(order.items) ? order.items : [];
          const total = order.total || order.total_amount || 0;
          const statusClass = 'status-' + status.toLowerCase().replace(/\\s+/g, '-');

          let stepperHtml = '';
          if (!isCancelled) {
            stepperHtml = `
              <div class="stepper">
                ${STEPS.map((st, idx) => {
                  let cls = '';
                  if (idx < stepIdx) cls = 'passed';
                  else if (idx === stepIdx) cls = 'active';
                  return `
                    <div class="step-item ${cls}">
                      <div class="step-circle">${idx < stepIdx ? '✓' : idx + 1}</div>
                      <div class="step-label">${st}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }

          const canCancel = ['confirmed', 'processing', 'created'].includes(status.toLowerCase());

          return `
            <div class="order-card">
              <div class="order-card-header">
                <div class="order-id-wrap">
                  <span style="font-size:20px;">📦</span>
                  <div>
                    <div class="order-id">Order #${(order.order_id || order.id || '').substring(0, 14)}</div>
                    <div class="order-date">Placed on ${dateStr}</div>
                  </div>
                </div>
                <span class="status-badge ${statusClass}">● ${status}</span>
              </div>

              ${stepperHtml}

              ${items.length > 0 ? `
                <div class="order-items-list">
                  <div style="font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:6px;">Items in package:</div>
                  ${items.map(it => `
                    <div class="order-item-row">
                      <span>${it.name || it.productName || 'Medicine Item'} × ${it.quantity || 1}</span>
                      <span style="font-weight:700;">₹${(it.price || 0) * (it.quantity || 1)}</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              <div class="order-footer">
                <div>
                  <span style="font-size:12px; color:var(--muted);">Total Amount:</span>
                  <span class="order-total-val">₹${total}</span>
                </div>
                ${canCancel ? `
                  <button class="btn-cancel" onclick="cancelOrder('${order.id}')">✕ Cancel Order</button>
                ` : ''}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loading orders:', err);
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--danger);">Failed to load orders: ${err.message}</div>`;
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      try {
        if (window.API && window.API.orders && window.API.orders.cancel) {
          await window.API.orders.cancel(orderId);
        } else {
          // Firestore update
          if (window.firebase && firebase.firestore) {
            await firebase.firestore().collection('orders').doc(orderId).update({ orderStatus: 'CANCELLED' });
          }
        }
        showToast('✅ Order cancelled successfully');
        loadOrders();
      } catch (err) {
        showToast('Error cancelling order: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
