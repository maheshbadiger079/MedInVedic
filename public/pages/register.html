  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8faf8;
      --card: rgba(255, 255, 255, 0.88);
      --card-border: rgba(22, 101, 52, 0.12);
      --primary: #166534;
      --primary-light: #22c55e;
      --accent: #15803d;
      --text: #1a2e1a;
      --muted: #52796f;
      --gradient: linear-gradient(135deg, #166534, #22c55e);
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(22, 101, 52, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(240, 253, 244, 0.6) 0px, transparent 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 30px 16px;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 460px;
    }
    .auth-card {
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 38px 34px;
      box-shadow: 0 20px 50px rgba(22, 101, 52, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--gradient);
    }
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      text-decoration: none;
      color: var(--primary);
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      background: var(--gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
    }
    .logo-text {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .logo-text span {
      color: var(--primary-light);
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.4;
    }
    .bonus-banner {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.12), rgba(22, 101, 52, 0.08));
      border: 1px dashed rgba(34, 197, 94, 0.4);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      font-size: 15px;
      color: var(--muted);
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(22, 101, 52, 0.15);
      border-radius: 12px;
      font-size: 13.5px;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--primary-light);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(22, 101, 52, 0.2);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(22, 101, 52, 0.28);
    }
    .auth-footer {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
    }
    .toast-msg.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="../landing.html" class="logo-wrap">
        <div class="logo-badge">🌿</div>
        <div class="logo-text">Med<span>InVedic</span></div>
      </a>
      <h2>Create Your Account</h2>
      <p class="subtitle">Join India's unified modern medicine &amp; Ayurvedic healthcare platform.</p>

      <div class="bonus-banner">
        <span style="font-size: 20px;">🎁</span>
        <div>Use a friend's referral code to unlock <strong>₹50 Instant Welcome Cashback</strong> in your wallet!</div>
      </div>
      
      <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-wrap">
            <span class="icon">👤</span>
            <input class="form-control" type="text" id="name" placeholder="e.g. Priya Sharma" required autocomplete="name" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrap">
            <span class="icon">✉️</span>
            <input class="form-control" type="email" id="email" placeholder="name@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="phone">Phone (Optional)</label>
            <div class="input-wrap">
              <span class="icon">📱</span>
              <input class="form-control" type="tel" id="phone" placeholder="+91..." autocomplete="tel" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="referral">Referral Code</label>
            <div class="input-wrap">
              <span class="icon">🏷️</span>
              <input class="form-control" type="text" id="referral" placeholder="MIV..." style="text-transform: uppercase;" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input class="form-control" type="password" id="password" placeholder="Min. 8 characters" required minlength="6" autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const referral = document.getElementById('referral').value.trim().toUpperCase();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');

      if (!name || !email || !pass) {
        showToast('Please fill in all required fields');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        let authUser;
        try {
          authUser = await window.API.auth.register(name, email, pass, phone);
        } catch (apiErr) {
          console.warn('API register fallback:', apiErr.message);
          if (window.firebase && firebase.auth) {
            const userCred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
            await userCred.user.updateProfile({ displayName: name });
            authUser = { id: userCred.user.uid, email, name, role: 'user' };
          } else {
            authUser = { id: 'u_' + Date.now(), email, name, role: 'user' };
          }
        }

        const userObj = {
          uid: (authUser && (authUser.id || authUser.uid)) || 'u_' + Date.now(),
          email,
          displayName: name,
          role: 'USER'
        };
        localStorage.setItem('mv_auth_user', JSON.stringify(userObj));
        localStorage.setItem('mv_user_role', 'USER');

        // Apply referral code if entered
        if (referral) {
          try {
            await fetch('/api/referrals/apply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('mv_auth_token') || ''}` },
              body: JSON.stringify({ referralCode: referral })
            });
            showToast('🎁 Welcome bonus of ₹50 credited to your wallet!');
          } catch (e) {
            console.warn('Referral apply non-blocking error:', e.message);
          }
        }

        showToast('✅ Account created successfully!');
        setTimeout(() => {
          window.location.replace('dashboard.html');
        }, 800);
      } catch (err) {
        console.error('Registration error:', err);
        showToast(err.message || 'Error creating account. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
