<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — MedInVedic</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <script src="/js/auth-guard.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #f0fdf4 0%, #ffffff 85%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(22, 101, 52, 0.15);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(22, 101, 52, 0.08);
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #166534, #22c55e);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(22, 101, 52, 0.25);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    p {
      font-size: 14.5px;
      color: #52796f;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #166534, #22c55e);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(22, 101, 52, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(22, 101, 52, 0.35);
    }
    .btn-outline {
      background: transparent;
      color: #166534;
      border: 1.5px solid rgba(22, 101, 52, 0.25);
    }
    .btn-outline:hover {
      background: rgba(22, 101, 52, 0.05);
    }
  </style>
  <script>
    // Intelligent automatic redirection
    (function() {
      const path = window.location.pathname;
      if (path.includes('pages/index.html') || path.includes('pages/landing.html')) {
        window.location.replace('/index.html');
        return;
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="badge-icon">🌿</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has moved. Let's get you back to the platform.</p>
    <div class="btn-group">
      <a href="/index.html" class="btn btn-primary">🌿 Go to Home Page</a>
      <a href="/pages/login.html" class="btn btn-outline">👤 Go to Login</a>
    </div>
  </div>
</body>
</html>
